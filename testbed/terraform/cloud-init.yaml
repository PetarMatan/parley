#cloud-config
# First boot of the testbed host. Installs Docker, clones the repository, writes
# a marker. Holds no secrets: user data is readable from inside the instance.
# Rendered by Terraform; ${repo_url} and ${repo_ref} are template variables.

package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - jq
  - make

write_files:
  - path: /etc/apt/keyrings/.keep
    content: ""
    permissions: "0644"

runcmd:
  # Docker Engine and the Compose plugin from Docker's repository.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
  # The repository that holds deploy/cloud. Secrets are copied in later over SSH.
  # Best effort: works only for a public repository. deploy.sh syncs the tree
  # over SSH in every case, so a failed clone is not an error.
  - mkdir -p /opt/parley
  - (git clone --branch "${repo_ref}" "${repo_url}" /opt/parley 2>/dev/null || true)
  - chown -R ubuntu:ubuntu /opt/parley
  # Marker that scripts/deploy.sh waits for.
  - install -d -m 0755 /var/lib/parley
  - date -u +%Y-%m-%dT%H:%M:%SZ > /var/lib/parley/cloud-init-done

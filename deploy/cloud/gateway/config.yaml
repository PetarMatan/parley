# yaml-language-server: $schema=https://raw.githubusercontent.com/agentgateway/agentgateway/26f5aebe99a36a037fe54f8080a608aca5547e15/schema/config.json
# agentgateway v1.7.0 standalone config for the cloud host (testbed plan,
# parley-testbed.md section 3). Caddy terminates TLS for channel.parleylab.dev
# and forwards to this listener. The only backend is the inbox service on the
# `services` Docker network. Same field set as gateway/config.yaml (the local
# sandbox config); see docs/gateway-notes.md.
config:
  logging:
    format: json
    level: info

frontendPolicies:
  accessLog:
    add:
      intLevel: "3"        # log convention: access log lines are INFO
      sender: jwt.preferred_username  # the username, the identity the inbox uses (identity_claim)
      sub: jwt.sub
      iss: jwt.iss
  http:
    # Idle keep-alive connections only; an open SSE stream carries a ping every 15 s.
    http1IdleTimeout: 2h

gateways:
  default:
    port: 3000

routes:
# Contract section 6: /healthz is the one route without a bearer token.
- name: healthz
  matches:
  - path:
      exact: /healthz
  backends:
  - host: inbox:7070

- name: inbox
  matches:
  - path:
      pathPrefix: /
  policies:
    jwtAuth:
      mode: strict
      # The inbox re-validates the same token (DECISIONS D7), so keep it.
      preserveToken: true
      providers:
      # Keycloak realm `parley`. Tokens carry iss https://auth.parleylab.dev/realms/parley
      # (the public URL, which KC_HOSTNAME fixes). The keys are fetched over the
      # Docker network from the keycloak service; only the iss string must match.
      # The audience `parley` is added to access tokens by the client's audience
      # mapper (deploy/cloud/keycloak/realm-parley.json), decision T4.
      - issuer: https://auth.parleylab.dev/realms/parley
        audiences: [parley]
        jwks:
          url: http://keycloak:8080/realms/parley/protocol/openid-connect/certs
    timeout:
      # requestTimeout ends when response headers arrive, so it never cuts an SSE
      # body. Kept long in case the inbox delays the headers of a stream.
      requestTimeout: 24h
      backendRequestTimeout: 24h
  backends:
  - host: inbox:7070
